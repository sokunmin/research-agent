[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend for the research agent"
authors = ["lz-chen <lingzhen.chen@inmeta.no>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-dotenv = "^1.0.1"
pydantic = "^2.8.2"
arxiv = "^2.1.3"
pyalex = ">=0.16"
pydantic-settings = "^2.4.0"
llama-index = ">=0.13.0,<0.15.0"
click = "^8.1.7"
litellm = ">=1.0,<=1.82.0"
llama-index-llms-litellm = ">=0.1.0"
llama-index-embeddings-litellm = ">=0.1.0"
qdrant-client = ">=1.18.0"
fastembed = ">=0.8.0"
llama-index-vector-stores-qdrant = ">=0.3.0"
unstructured = "^0.15.5"
pyvis = "^0.3.2"
llm-sandbox = {extras = ["docker"], version = "*"}
python-pptx = "^1.0.2"
fastapi = "^0.112.2"
uvicorn = "^0.30.6"
mlflow = "^3.10.0"
tiktoken = ">=0.12"
pyyaml = ">=6.0"
networkx = ">=3.0"
pillow = ">=10.0"
pymupdf = ">=1.27.0"
llama-index-utils-workflow = ">=0.9.5"
docling = ">=2.0.0"
pypdf = ">=4.0.0"


[tool.poetry.group.test.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
